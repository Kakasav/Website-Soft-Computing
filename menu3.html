<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSP Algoritma Genetika – Enhanced Web Version</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0d2616, #0f3b26, #0d2616);
            color: #e8f5e9;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .back-home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 61, 37, 0.85);
            border: 1px solid #3da970;
            color: #e8f5e9;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            backdrop-filter: blur(10px);
            display: inline-block;
            width: auto;
            max-width: fit-content;
        }

        .back-home-btn:hover {
            background: #3da970;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(61, 169, 112, 0.3);
        }

        .container {
            position: relative;
            width: 100%;
        }

        .main-container {
            display: flex;
            max-width: 1000px;
            margin: 0 auto;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .form-container {
            flex: 1;
            min-width: 300px;
            background: rgba(20, 61, 37, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-in-out;
        }

        .visualization-container {
            flex: 1;
            min-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #3da970;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
            opacity: 0.85;
            font-weight: 500;
        }

        .quantity {
            display: inline-block;
            width: 100%;
        }

        .quantity .input-text.qty {
            width: 48px;
            height: 42px;
            padding: 0 5px;
            text-align: center;
            background-color: #2b6643;
            border: 2px solid #3da970;
            border-left: none;
            border-right: none;
            color: #e8f5e9;
            font-size: 19px;
            font-weight: 600;
        }

        .quantity.buttons_added {
            text-align: left;
            position: relative;
            white-space: nowrap;
            vertical-align: top;
            display: flex;
            width: 100%;
        }

        .quantity.buttons_added input {
            display: inline-block;
            margin: 0;
            vertical-align: top;
            box-shadow: none;
            border-radius: 0;
        }

        .quantity.buttons_added .minus,
        .quantity.buttons_added .plus {
            padding: 7px 15px 8px;
            height: 45px;
            background-color: #2a7446;
            border: 1px solid #3da970;
            cursor: pointer;
            color: white;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantity.buttons_added .minus {
            border-right: 0;
            border-radius: 10px 0 0 10px;
            flex: 0 0 50px;
        }

        .quantity.buttons_added .plus {
            border-left: 0;
            border-radius: 0 10px 10px 0;
            flex: 0 0 50px;
        }

        .quantity.buttons_added .minus:hover,
        .quantity.buttons_added .plus:hover {
            background: #3da970;
            transform: scale(1.05);
        }

        .quantity input::-webkit-outer-spin-button,
        .quantity input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .quantity.buttons_added .minus:focus,
        .quantity.buttons_added .plus:focus {
            outline: none;
        }

        .probability-input {
            width: 100%;
        }

        .probability-input .quantity.buttons_added .input-text.qty {
            width: 80px;
        }

        .input-group::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #3da970, transparent);
            opacity: 0.3;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: linear-gradient(135deg, #2e7d51, #3da970);
            border: none;
            color: white;
            font-size: 17px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 20px rgba(61, 169, 112, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .button-glow {
            animation: buttonGlow 2s infinite;
        }

        @keyframes buttonGlow {

            0%,
            100% {
                box-shadow: 0 0 5px rgba(61, 169, 112, 0.5);
            }

            50% {
                box-shadow: 0 0 20px rgba(61, 169, 112, 0.8);
            }
        }

        .output-panel {
            background: rgba(27, 76, 46, 0.8);
            padding: 20px;
            border-radius: 14px;
            border-left: 4px solid #3da970;
            font-size: 14px;
            line-height: 1.6;
            transition: all 0.3s ease;
            flex: 1;
        }

        .output-panel.success {
            border-left-color: #3da970;
            background: rgba(27, 76, 46, 0.9);
            animation: pulse 2s;
        }

        .output-panel.error {
            border-left-color: #e74c3c;
            background: rgba(76, 27, 27, 0.9);
        }

        .progress-container {
            margin-top: 20px;
            height: 6px;
            background: rgba(27, 76, 46, 0.8);
            border-radius: 3px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #2e7d51, #3da970);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 3px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.8;
        }

        .stats span {
            background: rgba(27, 76, 46, 0.8);
            padding: 5px 10px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .stats span.highlight {
            background: rgba(61, 169, 112, 0.8);
            transform: scale(1.05);
        }

        .city-map-container {
            position: relative;
            height: 300px;
            background: rgba(27, 76, 46, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(61, 169, 112, 0.3);
            flex: 1;
            overflow: hidden;
        }

        .city-map {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .city-point {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #3da970;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(61, 169, 112, 0.8);
            transition: all 0.3s ease;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: white;
            border: 2px solid white;
        }

        .city-point:hover {
            transform: translate(-50%, -50%) scale(1.3);
            background: #4dd984;
            box-shadow: 0 0 20px rgba(61, 169, 112, 1);
        }

        .route-line {
            position: absolute;
            background: rgba(61, 169, 112, 0.7);
            z-index: 2;
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .route-line.optimal {
            background: rgba(255, 215, 0, 0.8);
            height: 4px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.02);
            }
        }

        .header-icon {
            font-size: 24px;
            margin-right: 10px;
            vertical-align: middle;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .result-item {
            background: rgba(27, 76, 46, 0.6);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .result-value {
            font-size: 18px;
            font-weight: bold;
            color: #3da970;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .form-container,
            .visualization-container {
                min-width: 100%;
            }

            .city-map-container {
                height: 250px;
            }

            .back-home-btn {
                position: relative;
                top: 0;
                left: 0;
                margin-bottom: 20px;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <button class="back-home-btn" onclick="window.location.href='/'">
            ← Back to home
        </button>
        <div class="main-container">
            <div class="form-container">
                <h2>TSP Algoritma Genetika</h2>

                <div class="input-group">
                    <label>Population Size:</label>
                    <div class="quantity buttons_added">
                        <input type="button" value="-" class="minus">
                        <input type="number" step="1" min="10" max="1000" name="quantity" value="100"
                            class="input-text qty text" id="pop">
                        <input type="button" value="+" class="plus">
                    </div>
                </div>

                <div class="input-group">
                    <label>Generations:</label>
                    <div class="quantity buttons_added">
                        <input type="button" value="-" class="minus">
                        <input type="number" step="1" min="10" max="5000" name="quantity" value="500"
                            class="input-text qty text" id="gen">
                        <input type="button" value="+" class="plus">
                    </div>
                </div>

                <div class="input-group">
                    <label>Tournament K:</label>
                    <div class="quantity buttons_added">
                        <input type="button" value="-" class="minus">
                        <input type="number" step="1" min="2" max="20" name="quantity" value="5"
                            class="input-text qty text" id="tk">
                        <input type="button" value="+" class="plus">
                    </div>
                </div>

                <div class="input-group">
                    <label>Probability Crossover (0-1):</label>
                    <div class="quantity buttons_added probability-input">
                        <input type="button" value="-" class="minus">
                        <input type="number" step="0.01" min="0" max="1" name="quantity" value="0.9"
                            class="input-text qty text" id="pc">
                        <input type="button" value="+" class="plus">
                    </div>
                </div>

                <div class="input-group">
                    <label>Probability Mutation (0-1):</label>
                    <div class="quantity buttons_added probability-input">
                        <input type="button" value="-" class="minus">
                        <input type="number" step="0.01" min="0" max="1" name="quantity" value="0.2"
                            class="input-text qty text" id="pm">
                        <input type="button" value="+" class="plus">
                    </div>
                </div>

                <div class="input-group">
                    <label>Elite Size:</label>
                    <div class="quantity buttons_added">
                        <input type="button" value="-" class="minus">
                        <input type="number" step="1" min="0" max="10" name="quantity" value="1"
                            class="input-text qty text" id="elite">
                        <input type="button" value="+" class="plus">
                    </div>
                </div>

                <button id="runButton" class="button-glow">Jalankan Algoritma Genetika</button>

                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div class="stats">
                    <span id="generationCount">Generasi: 0</span>
                    <span id="bestDistance">Jarak Terbaik: -</span>
                </div>
            </div>

            <div class="visualization-container">
                <div class="city-map-container">
                    <div class="city-map" id="cityMap">
                        <!-- City points and routes will be drawn here -->
                    </div>
                </div>

                <div class="output-panel" id="output">
                    <strong>Jalankan algoritma untuk melihat rute optimal</strong>
                    <div class="results-grid" id="resultsGrid" style="display: none;">
                        <div class="result-item">
                            <div>Jarak Terbaik</div>
                            <div class="result-value" id="finalDistance">-</div>
                        </div>
                        <div class="result-item">
                            <div>Generasi</div>
                            <div class="result-value" id="finalGenerations">-</div>
                        </div>
                    </div>
                    <div id="routeDetails" style="margin-top: 15px;"></div>
                </div>
            </div>
        </div>

        <script>
            const cities = ['A', 'B', 'C', 'D', 'E'];
            const dist = [
                [0, 7, 5, 9, 9],
                [7, 0, 7, 2, 8],
                [5, 7, 0, 4, 3],
                [9, 2, 4, 0, 6],
                [9, 8, 3, 6, 0]
            ];

            // Better fixed positions for visualization
            const cityPositions = [
                { x: 20, y: 50 },   // A
                { x: 80, y: 20 },   // B  
                { x: 30, y: 80 },   // C
                { x: 70, y: 70 },   // D
                { x: 50, y: 30 }    // E
            ];

            // Quantity buttons functionality
            function initQuantityButtons() {
                document.querySelectorAll('.quantity.buttons_added').forEach(quantity => {
                    const minus = quantity.querySelector('.minus');
                    const plus = quantity.querySelector('.plus');
                    const input = quantity.querySelector('.qty');

                    minus.addEventListener('click', () => {
                        let value = parseFloat(input.value);
                        const min = parseFloat(input.min);
                        const step = parseFloat(input.step) || 1;

                        if (value > min) {
                            value = Math.max(min, value - step);
                            if (input.step === '0.01') {
                                value = Math.round(value * 100) / 100;
                            }
                            input.value = value;
                            input.dispatchEvent(new Event('change'));
                        }
                    });

                    plus.addEventListener('click', () => {
                        let value = parseFloat(input.value);
                        const max = parseFloat(input.max);
                        const step = parseFloat(input.step) || 1;

                        if (value < max) {
                            value = Math.min(max, value + step);
                            if (input.step === '0.01') {
                                value = Math.round(value * 100) / 100;
                            }
                            input.value = value;
                            input.dispatchEvent(new Event('change'));
                        }
                    });

                    input.addEventListener('change', () => {
                        let value = parseFloat(input.value);
                        const min = parseFloat(input.min);
                        const max = parseFloat(input.max);

                        if (isNaN(value)) value = min;
                        value = Math.max(min, Math.min(max, value));

                        if (input.step === '0.01') {
                            value = Math.round(value * 100) / 100;
                        }

                        input.value = value;
                    });
                });
            }

            // Improved city drawing function
            function drawCities() {
                const map = document.getElementById('cityMap');
                map.innerHTML = '';

                cityPositions.forEach((pos, i) => {
                    const point = document.createElement('div');
                    point.className = 'city-point';
                    point.style.left = `${pos.x}%`;
                    point.style.top = `${pos.y}%`;
                    point.textContent = cities[i];
                    point.title = `Kota ${cities[i]}`;
                    map.appendChild(point);
                });
            }

            // Improved route drawing function
            function drawRoute(route) {
                const map = document.getElementById('cityMap');
                const mapRect = map.getBoundingClientRect();

                // Remove existing route lines
                const existingLines = document.querySelectorAll('.route-line');
                existingLines.forEach(line => line.remove());

                // Draw new route lines
                for (let i = 0; i < route.length; i++) {
                    const startCity = route[i];
                    const endCity = route[(i + 1) % route.length];

                    const startPos = cityPositions[startCity];
                    const endPos = cityPositions[endCity];

                    // Calculate the actual pixel positions
                    const startX = (startPos.x / 100) * mapRect.width;
                    const startY = (startPos.y / 100) * mapRect.height;
                    const endX = (endPos.x / 100) * mapRect.width;
                    const endY = (endPos.y / 100) * mapRect.height;

                    // Calculate distance and angle
                    const dx = endX - startX;
                    const dy = endY - startY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx) * (180 / Math.PI);

                    // Create line element
                    const line = document.createElement('div');
                    line.className = 'route-line';
                    
                    // Set line properties
                    line.style.width = `${distance}px`;
                    line.style.height = '3px';
                    line.style.left = `${startX}px`;
                    line.style.top = `${startY}px`;
                    line.style.transform = `rotate(${angle}deg)`;
                    line.style.transformOrigin = '0 0';

                    map.appendChild(line);
                }

                // Highlight the last line as optimal
                const lines = document.querySelectorAll('.route-line');
                if (lines.length > 0) {
                    lines[lines.length - 1].classList.add('optimal');
                }
            }

            function routeDistance(route) {
                let d = 0;
                for (let i = 0; i < route.length; i++) {
                    d += dist[route[i]][route[(i + 1) % route.length]];
                }
                return d;
            }

            function createIndividual(n) {
                let arr = [...Array(n).keys()];
                for (let i = n - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function tournament(pop, k) {
                let chosen = [];
                for (let i = 0; i < k; i++) chosen.push(pop[Math.floor(Math.random() * pop.length)]);
                return chosen.sort((a, b) => routeDistance(a) - routeDistance(b))[0];
            }

            function orderedCrossover(p1, p2) {
                let a = Math.floor(Math.random() * p1.length);
                let b = Math.floor(Math.random() * p1.length);
                if (a > b) [a, b] = [b, a];

                let child = Array(p1.length).fill(-1);
                for (let i = a; i <= b; i++) child[i] = p1[i];

                let idx = 0;
                for (let i = 0; i < p1.length; i++) {
                    if (child[i] === -1) {
                        while (child.includes(p2[idx])) idx++;
                        child[i] = p2[idx];
                    }
                }
                return child;
            }

            function mutate(ind) {
                let a = Math.floor(Math.random() * ind.length);
                let b = Math.floor(Math.random() * ind.length);
                [ind[a], ind[b]] = [ind[b], ind[a]];
            }

            async function runGA() {
                const runButton = document.getElementById('runButton');
                runButton.disabled = true;
                runButton.textContent = 'Menjalankan...';

                // Reset UI
                document.getElementById('output').className = 'output-panel';
                document.getElementById('progressContainer').style.display = 'block';
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('resultsGrid').style.display = 'none';

                const POP = parseInt(document.getElementById('pop').value);
                const GEN = parseInt(document.getElementById('gen').value);
                const TK = parseInt(document.getElementById('tk').value);
                const PC = parseFloat(document.getElementById('pc').value);
                const PM = parseFloat(document.getElementById('pm').value);
                const EL = parseInt(document.getElementById('elite').value);

                // Validate inputs
                if (POP < 10 || GEN < 10 || TK < 2 || PC < 0 || PC > 1 || PM < 0 || PM > 1 || EL < 0) {
                    document.getElementById('output').textContent = "Error: Silakan periksa nilai input Anda!";
                    document.getElementById('output').className = 'output-panel error';
                    document.getElementById('progressContainer').style.display = 'none';
                    runButton.disabled = false;
                    runButton.textContent = 'Jalankan Algoritma Genetika';
                    return;
                }

                // Draw cities on the map
                drawCities();

                let pop = [];
                for (let i = 0; i < POP; i++) pop.push(createIndividual(cities.length));

                let best = pop[0];
                let bestDist = routeDistance(best);

                // Draw initial route
                drawRoute(best);

                for (let g = 0; g < GEN; g++) {
                    // Update progress bar
                    const progress = (g / GEN) * 100;
                    document.getElementById('progressBar').style.width = `${progress}%`;

                    // Update stats
                    document.getElementById('generationCount').textContent = `Generasi: ${g}`;
                    document.getElementById('bestDistance').textContent = `Jarak Terbaik: ${bestDist}`;

                    // Highlight animation
                    if (g % 50 === 0) {
                        document.getElementById('bestDistance').classList.add('highlight');
                        setTimeout(() => {
                            document.getElementById('bestDistance').classList.remove('highlight');
                        }, 1000);
                    }

                    pop.sort((a, b) => routeDistance(a) - routeDistance(b));
                    if (routeDistance(pop[0]) < bestDist) {
                        best = pop[0];
                        bestDist = routeDistance(pop[0]);
                        // Update route visualization
                        drawRoute(best);
                    }

                    let newPop = pop.slice(0, EL);

                    while (newPop.length < POP) {
                        let p1 = tournament(pop, TK);
                        let p2 = tournament(pop, TK);
                        let child = Math.random() < PC ? orderedCrossover(p1, p2) : [...p1];
                        if (Math.random() < PM) mutate(child);
                        newPop.push(child);
                    }
                    pop = newPop;

                    // Allow UI updates
                    if (g % 10 === 0) {
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                }

                // Complete progress bar
                document.getElementById('progressBar').style.width = '100%';

                let route = best.map(i => cities[i]);
                document.getElementById('output').innerHTML = `
                    <strong>Rute Terbaik Ditemukan!</strong>
                    <div class="results-grid" id="resultsGrid" style="display: grid;">
                        <div class="result-item">
                            <div>Jarak Terbaik</div>
                            <div class="result-value" id="finalDistance">${bestDist}</div>
                        </div>
                        <div class="result-item">
                            <div>Generasi</div>
                            <div class="result-value" id="finalGenerations">${GEN}</div>
                        </div>
                    </div>
                    <div id="routeDetails" style="margin-top: 15px;">
                        <strong>Rute:</strong> ${route.join(" → ")} → ${route[0]}
                    </div>
                `;
                document.getElementById('output').className = 'output-panel success';

                // Update final stats
                document.getElementById('generationCount').textContent = `Generasi: ${GEN}`;
                document.getElementById('bestDistance').textContent = `Jarak Terbaik: ${bestDist}`;

                // Re-enable button
                runButton.disabled = false;
                runButton.textContent = 'Jalankan Algoritma Genetika';
            }

            // Initialize when page loads
            window.onload = function () {
                drawCities();
                initQuantityButtons();
                document.getElementById('runButton').addEventListener('click', runGA);
            };
        </script>
</body>

</html>
